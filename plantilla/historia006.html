<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:400;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:400;font-style:italic;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2)}
@font-face{font-family:Fraunces;font-weight:600;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}

@font-face{font-family:Plex;font-weight:500;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
:root{--bg:#F4EEE3;--ink:#1A1A1A;--acc:#F26B1D;--mute:#8A8479}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888}
.s{width:1080px;height:1920px;background:var(--bg);position:relative;overflow:hidden;color:var(--ink);font-family:Fraunces,serif;
  background-image:repeating-linear-gradient(to bottom,transparent 0 89px,rgba(26,26,26,.07) 89px 90px);background-position:0 40px}
.s::before{content:"";position:absolute;left:120px;top:0;bottom:0;width:3px;background:var(--acc);opacity:.55}
.head{position:absolute;top:80px;left:170px;right:90px;display:flex;justify-content:space-between;font-family:Plex;font-weight:500;font-size:30px;letter-spacing:.12em;text-transform:uppercase}
.head .n{color:var(--acc)}
.foot{position:absolute;bottom:70px;left:170px;right:90px;display:flex;justify-content:space-between;font-family:Plex;font-size:26px;color:var(--mute)}
.body{position:absolute;left:170px;right:110px;top:260px}
.big{font-size:132px;line-height:1.02;font-weight:600;letter-spacing:-.02em}
.mid{font-size:84px;line-height:1.12;font-weight:400;letter-spacing:-.01em}
em{font-style:italic;color:var(--acc)}
.mono{font-family:Plex;font-size:36px;line-height:1.6}
.eye{position:absolute}
.box{border:5px solid var(--ink);border-radius:22px;padding:40px 48px;background:#FFFDF8}
.strike{text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:5px;color:var(--mute)}

.row{display:flex;justify-content:space-between;border-bottom:2px dashed rgba(26,26,26,.18);padding:6px 0}
.row:last-child{border:0}
.row b{font-weight:500}
.ok{color:var(--acc);font-weight:500}

.st .head{top:270px}
.st .foot{bottom:330px}
.tag{display:inline-block;background:var(--acc);color:#FFFDF8;font-family:Plex;font-weight:500;font-size:34px;letter-spacing:.12em;padding:14px 26px;border-radius:14px}
</style></head><body>
<section class="s st">
  <div class="head"><span class="n">Apunte nº 006</span><span>Historia</span></div>
  <div class="body" style="top:520px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="tag">📓 NUEVO APUNTE</div><svg width="230" height="121" viewBox="340 380 400 240">
    <path d="M360 500 Q540 350 720 500 Q540 650 360 500 Z" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="540" cy="500" r="62" fill="#F26B1D"/><circle cx="540" cy="500" r="24" fill="#1A1A1A"/><circle cx="560" cy="478" r="10" fill="#FFFDF8"/>
  </svg></div>
    <div class="big" style="margin-top:70px;font-size:124px">Gracias a <em>nadie.</em></div>
    <div class="mono" style="margin-top:80px;color:var(--mute);font-size:38px">Bajáis del autobús<br>y dais las gracias<br>a 9 metros de distancia.</div>
  </div>
  <div class="foot" style="flex-direction:column;gap:14px"><span style="font-size:44px;color:var(--ink);font-weight:500">Ya en el perfil →</span><span style="font-size:30px">@apuntes.de.una.maquina</span></div>
</section>
</body></html>
